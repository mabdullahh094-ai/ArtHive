name: Deploy ArtHive (No Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-arthive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 51.21.111.113
      DEPLOY_USER: ubuntu
      DEPLOY_DIR: /var/www/arthive

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate SSH key
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not set"
            echo "Please add your SSH private key to GitHub Secrets"
            exit 1
          fi
          echo "✅ SSH key secret is configured"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'DEPLOY_SCRIPT'
          set -e

          DEPLOY_DIR=${{ env.DEPLOY_DIR }}
          echo "========================================"
          echo "🚀 ArtHive Deployment Starting"
          echo "========================================"
          echo "Server: ${{ env.DEPLOY_HOST }}"
          echo "Directory: $DEPLOY_DIR"
          echo ""

          # Navigate to deployment directory
          cd $DEPLOY_DIR || { echo "❌ Deploy directory not found"; exit 1; }

          # Update repository
          echo "📥 Pulling latest code from GitHub..."
          if [ -d ".git" ]; then
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            git clean -fd --quiet
            echo "✅ Code updated"
          else
            echo "⚠️  .git directory not found - skipping git update"
          fi

          # Verify .env files exist
          echo ""
          echo "🔍 Verifying environment configuration..."
          if [ ! -f "arthive-backend/.env" ]; then
            echo "❌ ERROR: arthive-backend/.env not found!"
            echo "Please create it manually before deploying"
            exit 1
          fi
          echo "✅ Backend .env found"

          if [ ! -f "arthive-frontend/.env" ]; then
            echo "⚠️  Frontend .env not found - some features may not work"
            # Don't exit, frontend can work with defaults
          else
            echo "✅ Frontend .env found"
          fi

          # Verify model file exists
          echo ""
          echo "🤖 Verifying ML model..."
          if [ ! -f "models/image_price_regressor_feedback_v2/best_model.pt" ]; then
            echo "⚠️  WARNING: ML model not found at models/image_price_regressor_feedback_v2/best_model.pt"
            echo "Price prediction features may not work until model is uploaded"
          else
            echo "✅ ML model found"
          fi

          # Create necessary directories
          echo ""
          echo "📁 Setting up upload directories..."
          mkdir -p arthive-backend/uploads/artist_portfolio
          mkdir -p arthive-backend/uploads/profile_pics
          mkdir -p arthive-backend/uploads/temp_predictions
          mkdir -p models/image_price_regressor_feedback_v2
          echo "✅ Directories ready"

          # Stop running services
          echo ""
          echo "⏹️  Stopping current services..."
          sudo systemctl stop arthive-backend 2>/dev/null || true
          sudo systemctl stop arthive-frontend 2>/dev/null || true
          sleep 2
          echo "✅ Services stopped"

          # Install backend dependencies
          echo ""
          echo "📦 Installing backend dependencies..."
          cd "$DEPLOY_DIR/arthive-backend"
          npm ci --omit=dev --prefer-offline --silent
          echo "✅ Backend dependencies installed"

          # Install Python dependencies for ML models
          echo ""
          echo "🐍 Installing Python ML dependencies..."
          if [ -f "ml_models/requirements.txt" ]; then
            pip3 install -q -r ml_models/requirements.txt --break-system-packages 2>/dev/null || pip3 install -q -r ml_models/requirements.txt
            echo "✅ Python dependencies installed"
          else
            echo "⚠️  ml_models/requirements.txt not found"
          fi
          cd "$DEPLOY_DIR"

          # Install and build frontend
          echo ""
          echo "📦 Installing frontend dependencies..."
          cd "$DEPLOY_DIR/arthive-frontend"
          npm ci --omit=dev --prefer-offline --silent
          echo "✅ Frontend dependencies installed"

          echo ""
          echo "🔨 Building frontend..."
          npm run build --silent 2>&1 | grep -E "(error|warning|✓)" || true
          echo "✅ Frontend built successfully"
          cd "$DEPLOY_DIR"

          # Start services
          echo ""
          echo "🚀 Starting services..."
          sudo systemctl start arthive-backend
          sudo systemctl start arthive-frontend
          sudo systemctl enable arthive-backend arthive-frontend --quiet 2>/dev/null || true
          echo "✅ Services started and enabled on boot"

          # Wait for services to be ready
          echo ""
          echo "⏳ Waiting for services to initialize..."
          sleep 5

          # Check service status
          echo ""
          echo "📊 Service Status:"
          if sudo systemctl is-active --quiet arthive-backend; then
            echo "  ✅ Backend (port 3001): RUNNING"
          else
            echo "  ❌ Backend (port 3001): FAILED"
          fi

          if sudo systemctl is-active --quiet arthive-frontend; then
            echo "  ✅ Frontend (port 3000): RUNNING"
          else
            echo "  ❌ Frontend (port 3000): FAILED"
          fi

          # Check Nginx
          echo ""
          echo "🌐 Checking Nginx..."
          if sudo systemctl is-active --quiet nginx; then
            echo "  ✅ Nginx: RUNNING"
            # Verify Nginx config
            if sudo nginx -t 2>&1 | grep -q "successful"; then
              echo "  ✅ Nginx config: VALID"
              # Reload Nginx to apply any changes
              sudo systemctl reload nginx
              echo "  ✅ Nginx reloaded"
            else
              echo "  ⚠️  Nginx config may have issues"
              sudo nginx -t
            fi
          else
            echo "  ⚠️  Nginx: NOT RUNNING (frontend may not be accessible via reverse proxy)"
          fi

          echo ""
          echo "========================================"
          echo "✅ Deployment Complete!"
          echo "========================================"
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          echo ""
          
          # Check backend
          echo "Checking Backend..."
          if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} 'systemctl is-active --quiet arthive-backend'; then
            echo "  ✅ Backend service is running"
            BACKEND_STATUS="RUNNING"
          else
            echo "  ❌ Backend service is NOT running"
            BACKEND_STATUS="FAILED"
          fi

          # Check frontend
          echo ""
          echo "Checking Frontend..."
          if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} 'systemctl is-active --quiet arthive-frontend'; then
            echo "  ✅ Frontend service is running"
            FRONTEND_STATUS="RUNNING"
          else
            echo "  ❌ Frontend service is NOT running"
            FRONTEND_STATUS="FAILED"
          fi

          echo ""
          echo "Status: Backend=$BACKEND_STATUS, Frontend=$FRONTEND_STATUS"

      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║   ✅ ArtHive Deployment Complete!     ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📊 Deployment Information:"
          echo "  Server IP: ${{ env.DEPLOY_HOST }}"
          echo "  Deploy User: ${{ env.DEPLOY_USER }}"
          echo "  Deploy Directory: ${{ env.DEPLOY_DIR }}"
          echo ""
          echo "🌐 Access Your Application:"
          echo ""
          echo "  📱 Via Nginx (Recommended):"
          echo "    http://${{ env.DEPLOY_HOST }}"
          echo "    (Nginx acts as reverse proxy for both frontend & backend)"
          echo ""
          echo "  📱 Direct Access (if needed):"
          echo "    Frontend: http://${{ env.DEPLOY_HOST }}:3000"
          echo "    Backend API: http://${{ env.DEPLOY_HOST }}:3001"
          echo ""
          echo "📝 Useful Commands:"
          echo "  Check backend logs:"
          echo "    ssh arthive@${{ env.DEPLOY_HOST }} 'sudo journalctl -u arthive-backend -f'"
          echo ""
          echo "  Check frontend logs:"
          echo "    ssh arthive@${{ env.DEPLOY_HOST }} 'sudo journalctl -u arthive-frontend -f'"
          echo ""
          echo "  Check Nginx:"
          echo "    ssh arthive@${{ env.DEPLOY_HOST }} 'sudo systemctl status nginx'"
          echo ""
          echo "  Restart services:"
          echo "    ssh arthive@${{ env.DEPLOY_HOST }} 'sudo systemctl restart arthive-backend arthive-frontend'"
          echo ""
          echo "  Reload Nginx:"
          echo "    ssh arthive@${{ env.DEPLOY_HOST }} 'sudo systemctl reload nginx'"
          echo ""
          echo "  View service status:"
          echo "    ssh arthive@${{ env.DEPLOY_HOST }} 'sudo systemctl status arthive-backend arthive-frontend nginx'"
          echo ""

