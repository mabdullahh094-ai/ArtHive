server {
    listen 80 default_server;
    server_name art-hive.tech www.art-hive.tech 51.21.111.113;

    # Redirect HTTP to HTTPS for the domains
    if ($host = art-hive.tech) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.art-hive.tech) {
        return 301 https://art-hive.tech$request_uri;
    }

    root /var/www/arthive/arthive-frontend/build;
    index index.html;

    # Frontend static build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API service
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expose uploaded files through backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name art-hive.tech www.art-hive.tech;

    ssl_certificate /etc/letsencrypt/live/art-hive.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art-hive.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/arthive/arthive-frontend/build;
    index index.html;

    # Frontend static build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API service
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expose uploaded files through backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
